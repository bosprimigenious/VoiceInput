name: VoiceInputMacApp
targets:
  VoiceInputMacApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: VoiceInputMacApp/Sources
    resources:
      - path: VoiceInputMacApp/Resources/whisper-cli
        buildPhase: resources
      - path: VoiceInputMacApp/Resources/ggml-medium.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai.voiceinputmacapp
        PRODUCT_NAME: VoiceInput
        CODE_SIGN_ENTITLEMENTS: VoiceInputMacApp/VoiceInputMacApp.entitlements
        INFOPLIST_FILE: VoiceInputMacApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "$(ARCHS_STANDARD)"
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "$(ARCHS_STANDARD)"
    info:
      path: VoiceInputMacApp/Info.plist
      properties:
        CFBundleDisplayName: VoiceInput
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: YES
        NSMicrophoneUsageDescription: "VoiceInput 需要麦克风权限来录制你的语音并转为文字。"
        NSSystemAdministrationUsageDescription: "VoiceInput 需要辅助功能权限来监听全局快捷键。"
